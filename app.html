<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Godamly</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M7 14 16 8l9 6v10H7z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/print.css" />
  <script>
    try {
      var theme = localStorage.getItem('godamly_theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="1.8"><path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9"/><path d="M9 19v-5h6v5"/></svg>
      </div>
      <h1>Godamly</h1>
      <p id="boot-msg">Preparing your warehouse…</p>
    </div>
  </div>
  <div id="app" class="app" hidden></div>
  <div id="print-root"></div>
  <div id="modal-root"></div>
  <div id="confirm-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('boot-msg').textContent = 'Run start.bat in the wms folder, then open http://localhost:5500';
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
